version: '3.8'

services:
  web:
    build: .
    command: poetry run python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=dev-key-change-me
      - REDIS_HOST=redis
    depends_on:
      - redis
      - worker
      - beat

  worker:
    build: .
    # --pool=solo обязателен на Windows, чтобы не было PermissionError/OSError
    command: poetry run celery -A config worker -l info --pool=solo
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - REDIS_HOST=redis
    depends_on:
      - redis

  beat:
    build: .
    command: poetry run celery -A config beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped